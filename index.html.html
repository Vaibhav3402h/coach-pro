</head>
<body class="bg-slate-100 text-slate-800">
<div id="root"></div>
<script type="text/babel">
const SUPA_URL="https://xfnxwciskkvpnwgsswic.supabase.co";
const SUPA_KEY="sb_publishable_pG5uFOUCgzCo174V7HFW1w_LoYH5JV2";
const ADMIN_EMAIL="vaibhavpandey00741@gmail.com";
const MY_UPI_ID="future.leiutinent@okicici";
const ADMIN_WA=""; // optional: your WhatsApp number with country code, e.g. 919876543210
const {useState,useEffect}=React;
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const ph=p=>{p=(p||'').replace(/\D/g,'');return p.length===10?'91'+p:p};
const wa=(p,t)=>`https://wa.me/${ph(p)}?text=${encodeURIComponent(t)}`;
const today=()=>new Date().toISOString().slice(0,10);
const COURSES=['Class 10','Class 12','JEE/NEET','Foundation'];
const BATCHES=['Morning 7 AM','Evening 4 PM'];
const inp="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500";
const btn=(c='indigo')=>`px-3 py-2 rounded-lg text-sm font-medium text-white bg-${c}-600 hover:bg-${c}-700`;
const WAB=({href,children})=><a href={href} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-green-600 hover:bg-green-700 whitespace-nowrap">{children||'WhatsApp'}</a>;
const F=({l,children})=><label className="block text-xs font-medium text-slate-600 mb-3">{l}{children}</label>;
const Modal=({title,close,children})=><div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2"><div className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-auto p-5"><div className="flex justify-between mb-3"><h3 className="font-bold text-lg">{title}</h3><button onClick={close} className="text-slate-400 text-xl">✕</button></div>{children}</div></div>;

function Setup({reload}){
  const [n,setN]=useState('');
  const go=async()=>{if(!n.trim())return;const r=await sb.rpc('create_institute',{p_name:n.trim()});if(r.error)alert(r.error.message);else reload();};
  return <div className="min-h-screen flex items-center justify-center p-4"><div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow">
    <h2 className="font-bold text-lg mb-3">Set up your institute</h2>
    <F l="Institute Name"><input className={inp} value={n} onChange={e=>setN(e.target.value)} placeholder="e.g. Sunrise Coaching Classes"/></F>
    <button onClick={go} className={btn()+' w-full'}>Start 7-Day Free Trial</button></div></div>;
}

function StudentModal({st,inst,done,close}){
  const [f,setF]=useState(st||{name:'',course:'Class 10',batch:'Morning 7 AM',parent_name:'',parent_phone:'',fee:'',paid:0,due_date:''});
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const due=Math.max(0,(+f.fee||0)-(+f.paid||0)),[err,setErr]=useState('');
  const save=async()=>{
    if(!f.name.trim()||!f.parent_phone.trim())return setErr('Student name and parent phone are required.');
    const keys=await existingKeys(inst,st&&st.id);
    if(keys.has(dkey(f.name,f.parent_phone)))return setErr('Duplicate entry blocked: a student named "'+f.name.trim()+'" with this parent phone already exists.');
    setErr('');
    const row={name:f.name,course:f.course,batch:f.batch,parent_name:f.parent_name,parent_phone:f.parent_phone,fee:+f.fee||0,paid:+f.paid||0,due_date:f.due_date||null};
    let sid=st&&st.id,delta=row.paid-(st?st.paid:0),r;
    if(st)r=await sb.from('students').update(row).eq('id',sid);
    else{r=await sb.from('students').insert({...row,institute_id:inst.id}).select().single();sid=r.data&&r.data.id}
    if(r.error)return alert(r.error.message);
    if(delta>0)await sb.from('payments').insert({institute_id:inst.id,student_id:sid,amount:delta});
    done();
  };
  return <Modal title={st?'Edit Student':'Add Student'} close={close}>
    <F l="Student Name"><input className={inp} value={f.name} onChange={set('name')}/></F>
    <div className="grid grid-cols-2 gap-3">
      <F l="Class / Course"><input list="cl" className={inp} value={f.course} onChange={set('course')}/></F>
      <F l="Batch Timing"><input list="bl" className={inp} value={f.batch} onChange={set('batch')}/></F></div>
    <datalist id="cl">{COURSES.map(c=><option key={c}>{c}</option>)}</datalist><datalist id="bl">{BATCHES.map(c=><option key={c}>{c}</option>)}</datalist>
    <div className="grid grid-cols-2 gap-3">
      <F l="Parent Name"><input className={inp} value={f.parent_name} onChange={set('parent_name')}/></F>
      <F l="Parent Phone"><input className={inp} inputMode="tel" value={f.parent_phone} onChange={set('parent_phone')}/></F>
      <F l="Monthly / Course Fee (₹)"><input className={inp} type="number" value={f.fee} onChange={set('fee')}/></F>
      <F l="Paid Amount (₹)"><input className={inp} type="number" value={f.paid} onChange={set('paid')}/></F></div>
    <div className="flex justify-between items-center bg-amber-50 rounded-lg px-3 py-2 mb-3 text-sm"><span>Pending Due</span><b className="text-amber-700">{inr(due)}</b></div>
    <F l="Next Fee Due Date"><input className={inp} type="date" value={f.due_date||''} onChange={set('due_date')}/></F>
    {err&&<div className="bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2 text-sm mb-3">⚠ {err}</div>}
    <button onClick={save} className={btn()+' w-full'}>Save Student</button></Modal>;
}

function Receipt({st,inst,close}){
  const due=Math.max(0,st.fee-st.paid);
  const msg=`Fee Receipt - ${inst.name}\nStudent: ${st.name} (${st.course})\nPaid: Rs.${st.paid}\nBalance Due: Rs.${due}\nDate: ${new Date().toLocaleDateString('en-IN')}`;
  return <Modal title="Fee Receipt" close={close}>
    <div id="receipt" className="border-2 border-dashed rounded-xl p-4 text-sm">
      <div className="text-center font-bold text-lg">{inst.name}</div><div className="text-center text-xs text-slate-500 mb-3">Fee Receipt</div>
      {[['Student',st.name],['Class',st.course],['Paid Amount',inr(st.paid)],['Balance Due',inr(due)],['Date',new Date().toLocaleDateString('en-IN')]].map(([a,b])=><div key={a} className="flex justify-between py-1 border-b"><span className="text-slate-500">{a}</span><b>{b}</b></div>)}</div>
    <div className="flex gap-2 mt-3"><button onClick={()=>window.print()} className={btn()+' flex-1'}>Print</button><a href={wa(st.parent_phone,msg)} target="_blank" rel="noreferrer" className={btn('green')+' flex-1 text-center'}>Share on WhatsApp</a></div></Modal>;
}

const dkey=(n,p)=>(n||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+(p||'').replace(/\D/g,'').slice(-10);
const existingKeys=async(inst,exceptId)=>{const {data}=await sb.from('students').select('id,name,parent_phone').eq('institute_id',inst.id);return new Set((data||[]).filter(x=>x.id!==exceptId).map(x=>dkey(x.name,x.parent_phone)))};
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()};
const isoDate=s=>{const m=(s||'').match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:(s||null)};
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}

function Queue({items,label,close}){
  const [i,setI]=useState(0),n=items.length,cur=items[i];
  const next=()=>setTimeout(()=>setI(x=>x+1),150);
  return <Modal title="Bulk WhatsApp Queue" close={close}>
    {cur?<div className="text-center">
      <div className="h-2 bg-slate-100 rounded mb-3"><div className="h-2 bg-green-600 rounded" style={{width:(i/n*100)+'%'}}></div></div>
      <div className="text-xs text-slate-500">{i+1} of {n}</div><div className="text-lg font-bold">{cur.name}</div><div className="text-sm text-slate-500 mb-2">{cur.phone}</div>
      <div className="text-xs bg-slate-50 rounded-lg p-2 mb-4 text-left whitespace-pre-line">{cur.text}</div>
      <a href={wa(cur.phone,cur.text)} target="_blank" rel="noreferrer" onClick={next} className="block w-full py-4 rounded-xl text-white text-lg font-bold bg-green-600 hover:bg-green-700">{label} & Next ({i+1}/{n}) →</a>
      <button onClick={()=>setI(x=>x+1)} className="mt-3 text-sm text-slate-500">Skip this one</button>
    </div>:<div className="text-center py-6"><div className="text-4xl">✅</div><p className="font-semibold mt-2">All {n} messages are done</p><button onClick={close} className={btn()+' mt-3'}>Close</button></div>}
  </Modal>;
}

function Students({d,inst,reload,openAdd,ro}){
  const [q,setQ]=useState(''),[ed,setEd]=useState(null),[rc,setRc]=useState(null),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false);
  const list=d.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
  const del=async s=>{if(!confirm(`Are you sure you want to delete ${s.name}? All records will be permanently removed.`))return;const r=await sb.from('students').delete().eq('id',s.id);if(r.error)alert(r.error.message);reload()};
  const sample=()=>dl('coachpro_students_sample.csv','Student Name,Class,Batch,Parent Name,Parent Phone,Total Fee,Paid,Due Date\nRahul Sharma,Class 10,Morning 7 AM,Suresh Sharma,9876543210,1500,500,2026-12-05\nPriya Verma,Class 12,Evening 4 PM,Anil Verma,9123456780,2000,2000,2026-12-10\n');
  const imp=async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;setBusy(true);setMsg('');
    try{
      const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));
      const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
      if(ix('student name')<0||ix('parent phone')<0){setMsg('error:The file must have "Student Name" and "Parent Phone" columns. Download the sample CSV to see the format.');setBusy(false);return}
      const g=(r,n)=>ix(n)<0?'':(r[ix(n)]||'').trim();
      const keys=await existingKeys(inst),add=[];let dup=0,bad=0;
      rows.forEach(r=>{const name=g(r,'student name'),pp=g(r,'parent phone');if(!name||!pp){bad++;return}const k=dkey(name,pp);if(keys.has(k)){dup++;return}keys.add(k);add.push({institute_id:inst.id,name,course:g(r,'class')||null,batch:g(r,'batch')||null,parent_name:g(r,'parent name')||null,parent_phone:pp,fee:+g(r,'total fee')||0,paid:+g(r,'paid')||0,due_date:isoDate(g(r,'due date'))})});
      let ok=0;
      for(let i=0;i<add.length;i+=500){
        const r=await sb.from('students').insert(add.slice(i,i+500)).select('id,paid');
        if(r.error){setMsg('error:'+r.error.message);setBusy(false);reload();return}
        ok+=r.data.length;
        const pay=r.data.filter(x=>x.paid>0).map(x=>({institute_id:inst.id,student_id:x.id,amount:x.paid}));
        if(pay.length)await sb.from('payments').insert(pay);
      }
      setMsg(`ok:Imported ${ok} students, skipped ${dup} duplicates`+(bad?` (${bad} rows ignored: missing name or phone)`:'')+'.');
    }catch(x){setMsg('error:'+x.message)}
    setBusy(false);reload();
  };
  return <div>
    <div className="flex flex-wrap gap-2 mb-3"><input className={inp+' !mt-0 flex-1 min-w-[140px]'} placeholder="Search students" value={q} onChange={e=>setQ(e.target.value)}/>
      {!ro&&<button onClick={openAdd} className={btn()+' whitespace-nowrap'}>+ Add Student</button>}
      {!ro&&<label className={btn('violet')+' whitespace-nowrap cursor-pointer'}>{busy?'Importing…':'Import CSV'}<input type="file" accept=".csv,text/csv" className="hidden" onChange={imp} disabled={busy}/></label>}
      {!ro&&<button onClick={sample} className="px-3 py-2 rounded-lg text-sm bg-white border">Download Sample CSV</button>}</div>
    {msg&&<div className={`rounded-lg px-3 py-2 text-sm mb-3 ${msg.startsWith('ok:')?'bg-green-50 text-green-700':'bg-red-50 text-red-700'}`}>{msg.replace(/^(ok|error):/,'')}</div>}
    <div className="space-y-2">{list.map(s=><div key={s.id} className="bg-white rounded-xl p-3 shadow-sm flex flex-wrap justify-between gap-2">
      <div><div className="font-semibold">{s.name}</div><div className="text-xs text-slate-500">{s.course} · {s.batch} · {s.parent_name} {s.parent_phone}</div>
        {!ro&&<div className="text-xs mt-1">Fee {inr(s.fee)} · Paid {inr(s.paid)} · <b className="text-amber-700">Due {inr(s.fee-s.paid)}</b></div>}</div>
      {!ro&&<div className="flex gap-1 items-start text-xs"><button onClick={()=>setRc(s)} className="px-2 py-1.5 rounded-lg bg-slate-100">Receipt</button><button onClick={()=>setEd(s)} className="px-2 py-1.5 rounded-lg bg-slate-100">Edit</button><button onClick={()=>del(s)} title="Delete" className="px-2.5 py-1.5 rounded-lg bg-red-600 text-white">🗑</button></div>}</div>)}
      {!list.length&&<p className="text-sm text-slate-500">No students yet.</p>}</div>
    {ed&&<StudentModal st={ed} inst={inst} close={()=>setEd(null)} done={()=>{setEd(null);reload()}}/>}
    {rc&&<Receipt st={rc} inst={inst} close={()=>setRc(null)}/>}</div>;
}

function Fees({d,inst}){
  const [b,setB]=useState('All'),[s,setS]=useState('Pending'),[rc,setRc]=useState(null),[qu,setQu]=useState(false);
  const batches=[...new Set(d.students.map(x=>x.batch).filter(Boolean))];
  const list=d.students.filter(x=>(b==='All'||x.batch===b)&&(s==='All'||(x.fee-x.paid>0&&(s==='Pending'||(x.due_date&&x.due_date<today())))));
  const dueList=list.filter(x=>x.fee-x.paid>0);
  const text=x=>`Dear Parent, fee of Rs.${x.fee-x.paid} for ${x.name} is due at ${inst.name}. Please pay at your earliest convenience.`;
  return <div><div className="flex gap-2 mb-3">
    <select className={inp+' !mt-0'} value={b} onChange={e=>setB(e.target.value)}><option>All</option>{batches.map(x=><option key={x}>{x}</option>)}</select>
    <select className={inp+' !mt-0'} value={s} onChange={e=>setS(e.target.value)}><option>Pending</option><option>Overdue</option><option>All</option></select></div>
    {dueList.length>0&&<button onClick={()=>setQu(true)} className={btn('green')+' w-full mb-3'}>Send Bulk Fee Reminders ({dueList.length})</button>}
    <div className="space-y-2">{list.map(x=>{const due=x.fee-x.paid;return <div key={x.id} className="bg-white rounded-xl p-3 shadow-sm flex justify-between items-center gap-2">
      <div><div className="font-semibold">{x.name}</div><div className="text-xs text-slate-500">{x.batch} · Due date {x.due_date||'—'}</div><div className="text-sm font-bold text-amber-700">{inr(due)}</div></div>
      <div className="flex gap-1"><button onClick={()=>setRc(x)} className="px-2 py-1.5 rounded-lg bg-slate-100 text-xs">Receipt</button>
        <WAB href={wa(x.parent_phone,text(x))}>Remind</WAB></div></div>})}
      {!list.length&&<p className="text-sm text-slate-500">Nothing to show.</p>}</div>
    {rc&&<Receipt st={rc} inst={inst} close={()=>setRc(null)}/>}
    {qu&&<Queue items={dueList.map(x=>({name:x.name,phone:x.parent_phone,text:text(x)}))} label="Send" close={()=>setQu(false)}/>}</div>;
}

function Attendance({d,inst,reload}){
  const batches=[...new Set([...BATCHES,...d.students.map(x=>x.batch).filter(Boolean)])];
  const [b,setB]=useState(batches[0]),[loc,setLoc]=useState({}),[ab,setAb]=useState(null),[qu,setQu]=useState(false),[sv,setSv]=useState(false);
  const map={};d.att.forEach(a=>map[a.student_id]=a.status);
  const list=d.students.filter(x=>x.batch===b);
  const st=s=>loc[s.id]||map[s.id];
  const msg=s=>`Alert from ${inst.name}: Your ward ${s.name} is ABSENT from class today.`;
  const dirty=Object.keys(loc).length>0;
  const save=async()=>{
    const rows=list.filter(s=>st(s)).map(s=>({institute_id:inst.id,student_id:s.id,att_date:today(),status:st(s)}));
    if(!rows.length)return alert('Mark attendance for at least one student first.');
    setSv(true);const r=await sb.from('attendance').upsert(rows,{onConflict:'student_id,att_date'});setSv(false);
    if(r.error)return alert(r.error.message);
    const abs=rows.filter(x=>x.status==='absent').map(x=>list.find(s=>s.id===x.student_id));
    setLoc({});await reload();
    if(abs.length)setAb(abs);else alert('Attendance saved. No students are absent today.');
  };
  return <div><div className="flex gap-2 mb-3"><select className={inp+' !mt-0'} value={b} onChange={e=>{setB(e.target.value);setLoc({})}}>{batches.map(x=><option key={x}>{x}</option>)}</select>
    <button onClick={()=>{const m={};list.forEach(s=>m[s.id]='present');setLoc(m)}} className="px-3 py-2 rounded-lg text-sm bg-white border whitespace-nowrap">All Present</button></div>
    <div className="space-y-2">{list.map(s=><div key={s.id} className="bg-white rounded-xl p-3 shadow-sm flex justify-between items-center gap-2">
      <div className="font-semibold">{s.name}</div>
      <div className="flex gap-1 items-center">
        <button onClick={()=>setLoc({...loc,[s.id]:'present'})} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${st(s)==='present'?'bg-green-600 text-white':'bg-green-50 text-green-700'}`}>Present</button>
        <button onClick={()=>setLoc({...loc,[s.id]:'absent'})} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${st(s)==='absent'?'bg-red-600 text-white':'bg-red-50 text-red-700'}`}>Absent</button>
        {st(s)==='absent'&&<WAB href={wa(s.parent_phone,msg(s))}>Alert Parent</WAB>}</div></div>)}
      {!list.length&&<p className="text-sm text-slate-500">No students in this batch.</p>}</div>
    {list.length>0&&<button onClick={save} disabled={sv} className={btn('green')+' w-full mt-3 py-3'}>{sv?'Saving…':'Save Attendance'}{dirty?' (unsaved changes)':''}</button>}
    {ab&&!qu&&<Modal title="Attendance Saved" close={()=>setAb(null)}><div className="text-center"><div className="text-4xl">📢</div>
      <p className="font-bold text-lg my-3">{ab.length} Students Absent Today — Send WhatsApp Alerts to Parents</p>
      <button onClick={()=>setQu(true)} className="w-full py-3 rounded-xl text-white font-bold bg-green-600 hover:bg-green-700">Start Bulk Absent Alerts</button>
      <button onClick={()=>setAb(null)} className="mt-3 text-sm text-slate-500">Not now</button></div></Modal>}
    {ab&&qu&&<Queue items={ab.map(s=>({name:s.name,phone:s.parent_phone,text:msg(s)}))} label="Send Absent Alert" close={()=>{setQu(false);setAb(null)}}/>}</div>;
}

function Inquiries({d,inst,reload}){
  const [f,setF]=useState({name:'',course:'Class 10',phone:'',followup_date:''});
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const save=async()=>{if(!f.name||!f.phone)return alert('Name and phone are required');
    const r=await sb.from('inquiries').insert({...f,followup_date:f.followup_date||null,institute_id:inst.id});if(r.error)return alert(r.error.message);setF({name:'',course:'Class 10',phone:'',followup_date:''});reload()};
  const del=async i=>{if(!confirm(`Are you sure you want to delete ${i.name}? All records will be permanently removed.`))return;const r=await sb.from('inquiries').delete().eq('id',i.id);if(r.error)alert(r.error.message);reload()};
  return <div><div className="bg-white rounded-xl p-3 shadow-sm mb-3"><div className="grid grid-cols-2 gap-x-3">
    <F l="Student Name"><input className={inp} value={f.name} onChange={set('name')}/></F>
    <F l="Class / Course"><input list="cl" className={inp} value={f.course} onChange={set('course')}/></F>
    <F l="Phone"><input className={inp} inputMode="tel" value={f.phone} onChange={set('phone')}/></F>
    <F l="Follow-up Date"><input className={inp} type="date" value={f.followup_date} onChange={set('followup_date')}/></F></div>
    <button onClick={save} className={btn()}>+ Add Inquiry</button></div>

function Exams({d,inst,reload}){
  const classes=[...new Set(d.students.map(x=>x.course).filter(Boolean))];
  const [c0,setC]=useState(''),[ex,setEx]=useState(EXAMS[0]),[custom,setCustom]=useState(null),[mk,setMk]=useState({}),[qu,setQu]=useState(false),[sv,setSv]=useState(false),[ns,setNs]=useState('');
  const cls=c0||classes[0]||'';
  const stu=d.students.filter(s=>s.course===cls);
  const saved=d.exams.filter(e=>e.class_name===cls&&e.exam_type===ex),by={};saved.forEach(e=>by[e.student_id]=e);
  const subs=custom||(saved.length&&saved[0].subjects_json&&Object.keys(saved[0].subjects_json).length?Object.keys(saved[0].subjects_json).map(n=>({n,m:(saved[0].subjects_json[n]||{}).m||100})):DEF_SUBJECTS.map(n=>({n,m:100})));
  const val=(id,n)=>mk[id]&&mk[id][n]!==undefined?mk[id][n]:(by[id]&&by[id].subjects_json&&by[id].subjects_json[n]&&by[id].subjects_json[n].o!=null?String(by[id].subjects_json[n].o):'');
  const rows=stu.map(s=>{let to=0,tm=0,any=false,fail=false;subs.forEach(u=>{const v=val(s.id,u.n);tm+=+u.m||0;if(v!==''&&!isNaN(+v)){any=true;to+=+v;if(+u.m&&+v/+u.m*100<33)fail=true}});const pct=any&&tm?to/tm*100:null;return{...s,to,tm,any,fail,pct,grade:pct===null?'—':gradeOf(pct,fail)}});
  const ranked=rows.filter(r=>r.any).sort((a,b)=>b.to-a.to);
  ranked.forEach((r,i)=>{r.rank=i>0&&r.to===ranked[i-1].to?ranked[i-1].rank:i+1});
  const setMark=(id,n,v)=>setMk({...mk,[id]:{...(mk[id]||{}),[n]:v}});
  const setSub=(i,m)=>setCustom(subs.map((u,j)=>j===i?{...u,m}:u));
  const delSub=i=>subs.length>1&&setCustom(subs.filter((_,j)=>j!==i));
  const addSub=()=>{const n=ns.trim();if(n&&!subs.some(u=>u.n.toLowerCase()===n.toLowerCase())){setCustom([...subs,{n,m:100}]);setNs('')}};
  const save=async()=>{
    if(!ranked.length)return alert('Enter marks for at least one student.');
    for(const r of ranked)for(const u of subs){const v=val(r.id,u.n);if(v!==''&&(+v<0||+v>+u.m))return alert(`Invalid marks for ${r.name} in ${u.n}. Marks must be between 0 and ${u.m}.`)}
    setSv(true);
    const rowsOut=ranked.map(r=>({institute_id:inst.id,student_id:r.id,class_name:cls,exam_type:ex,subjects_json:Object.fromEntries(subs.map(u=>{const v=val(r.id,u.n);return[u.n,{o:v===''?null:+v,m:+u.m}]})),total_obtained:r.to,total_max:r.tm,percentage:+r.pct.toFixed(2),grade:r.grade}));
    const res=await sb.from('exam_marks').upsert(rowsOut,{onConflict:'student_id,exam_type'});
    setSv(false);if(res.error)return alert(res.error.message);
    setMk({});await reload();alert('Marks saved for '+ranked.length+' students.');
  };
  const card=r=>{
    if(!r.any)return alert('Enter marks for this student first.');
    const html=`<div style="border:3px double #333;padding:18px"><div style="text-align:center;font-size:24px;font-weight:bold">${esc(inst.name)}</div><div style="text-align:center;font-size:16px;margin:4px 0 12px">REPORT CARD — ${esc(ex)}</div>
<table style="width:100%;font-size:14px;margin-bottom:12px"><tr><td><b>Student:</b> ${esc(r.name)}</td><td><b>Class:</b> ${esc(cls)}</td></tr><tr><td><b>Parent:</b> ${esc(r.parent_name)}</td><td><b>Date:</b> ${new Date().toLocaleDateString('en-IN')}</td></tr></table>
<table style="border-collapse:collapse;width:100%"><tr style="background:#e5e7eb;font-weight:bold"><td style="${TD}">Subject</td><td style="${TD};text-align:center">Max Marks</td><td style="${TD};text-align:center">Marks Obtained</td></tr>${subs.map(u=>{const v=val(r.id,u.n);return`<tr><td style="${TD}">${esc(u.n)}</td><td style="${TD};text-align:center">${u.m}</td><td style="${TD};text-align:center">${v===''?'—':v}</td></tr>`}).join('')}<tr style="font-weight:bold;background:#f3f4f6"><td style="${TD}">Total</td><td style="${TD};text-align:center">${r.tm}</td><td style="${TD};text-align:center">${r.to}</td></tr></table>
<table style="width:100%;font-size:15px;margin:14px 0"><tr><td><b>Percentage:</b> ${r.pct.toFixed(1)}%</td><td><b>Grade:</b> ${r.grade}</td><td><b>Rank:</b> ${ord(r.rank)} of ${ranked.length}</td><td><b>Result:</b> ${r.grade==='Fail'?'Fail':'Pass'}</td></tr></table>
<div style="display:flex;justify-content:space-between;margin-top:56px;font-size:13px"><div style="border-top:1px solid #000;padding-top:4px;width:28%;text-align:center">Class Teacher</div><div style="border-top:1px solid #000;padding-top:4px;width:28%;text-align:center">Parent's Signature</div><div style="border-top:1px solid #000;padding-top:4px;width:28%;text-align:center">Principal Signature</div></div></div>`;
    pdfOut(html,`${r.name}_${ex}_report_card`,false);
  };
  const sheet=()=>{
    if(!ranked.length)return alert('Enter marks first.');
    const h=['Rank','Student Name',...subs.map(u=>`${esc(u.n)} (${u.m})`),'Total','%','Grade'];
    const html=`<div style="text-align:center;font-size:22px;font-weight:bold">${esc(inst.name)}</div><div style="text-align:center;font-size:15px;margin:4px 0 10px">${esc(ex)} — Result Register — ${esc(cls)} — ${new Date().toLocaleDateString('en-IN')}</div><table style="border-collapse:collapse;width:100%"><tr style="background:#e5e7eb;font-weight:bold">${h.map(x=>`<td style="${TD}">${x}</td>`).join('')}</tr>${ranked.map(r=>`<tr><td style="${TD}">${r.rank}</td><td style="${TD}">${esc(r.name)}</td>${subs.map(u=>`<td style="${TD};text-align:center">${val(r.id,u.n)||'—'}</td>`).join('')}<td style="${TD};font-weight:bold">${r.to}/${r.tm}</td><td style="${TD}">${r.pct.toFixed(1)}%</td><td style="${TD};font-weight:bold;color:${r.grade==='Fail'?'#b91c1c':'#15803d'}">${r.grade}</td></tr>`).join('')}</table>`;
    pdfOut(html,`${cls}_${ex}_result_register`,true);
  };
  const items=ranked.map(r=>({name:r.name,phone:r.parent_phone,text:`Result - ${inst.name}\nExam: ${ex} (${cls})\nStudent: ${r.name}\n${subs.map(u=>`${u.n}: ${val(r.id,u.n)||'-'}/${u.m}`).join('\n')}\nTotal: ${r.to}/${r.tm}\nPercentage: ${r.pct.toFixed(1)}%\nGrade: ${r.grade}\nClass Rank: ${ord(r.rank)} of ${ranked.length}`}));
  const c="border border-slate-300 px-2 py-1.5";
  return <div><div className="bg-white rounded-xl p-3 shadow-sm mb-3"><div className="grid grid-cols-2 gap-x-3">
    <F l="Class"><select className={inp} value={cls} onChange={e=>{setC(e.target.value);setCustom(null);setMk({})}}>{classes.map(x=><option key={x}>{x}</option>)}</select></F>
    <F l="Exam Type"><select className={inp} value={ex} onChange={e=>{setEx(e.target.value);setCustom(null);setMk({})}}>{EXAMS.map(x=><option key={x}>{x}</option>)}</select></F></div>
    <div className="flex gap-2"><input className={inp+' !mt-0'} placeholder="Add subject (e.g. Computer)" value={ns} onChange={e=>setNs(e.target.value)}/><button onClick={addSub} className={btn()+' whitespace-nowrap'}>+ Subject</button></div>
    <p className="text-xs text-slate-500 mt-2">Set max marks under each subject name. Grades: A1 90+, A2 80+, B1 70+, B2 60+, C 50+, D 33+, otherwise Fail (below 33% in any subject is also Fail).</p></div>
    {!stu.length?<p className="text-sm text-slate-500">No students found for this class.</p>:<div>
      <div className="overflow-x-auto bg-white rounded-xl shadow-sm mb-3"><table className="w-full text-sm border-collapse">
        <thead className="bg-slate-100"><tr><th className={c+' text-left'}>Rank</th><th className={c+' text-left'}>Student</th>
          {subs.map((u,i)=><th key={u.n} className={c+' text-left'}><div className="flex items-center gap-1 whitespace-nowrap">{u.n}<button onClick={()=>delSub(i)} className="text-red-500 text-xs">✕</button></div><div className="text-xs font-normal">Max <input type="number" className="w-14 border rounded px-1" value={u.m} onChange={e=>setSub(i,e.target.value)}/></div></th>)}
          <th className={c+' text-left'}>Total</th><th className={c+' text-left'}>%</th><th className={c+' text-left'}>Grade</th><th className={c}></th></tr></thead>
        <tbody>{rows.map(r=><tr key={r.id}><td className={c+' font-bold'}>{r.any?ord(r.rank):'—'}</td><td className={c+' whitespace-nowrap'}>{r.name}</td>
          {subs.map(u=><td key={u.n} className={c}><input type="number" inputMode="decimal" className="w-16 border rounded px-1.5 py-1" value={val(r.id,u.n)} onChange={e=>setMark(r.id,u.n,e.target.value)}/></td>)}
          <td className={c+' whitespace-nowrap'}>{r.any?`${r.to}/${r.tm}`:'—'}</td><td className={c}>{r.pct!==null?r.pct.toFixed(1)+'%':'—'}</td>
          <td className={c+' font-semibold '+(r.grade==='Fail'?'text-red-600':'text-green-700')}>{r.grade}</td>
          <td className={c}><button onClick={()=>card(r)} className="px-2 py-1.5 rounded-lg bg-slate-700 text-white text-xs min-w-[110px]">Download Report Card PDF</button></td></tr>)}</tbody></table></div>
      <div className="grid gap-2">
        <button onClick={save} disabled={sv} className={btn()+' py-3'}>{sv?'Saving…':'Save All Marks'}</button>

    {qu&&<Queue items={items} label="Send Result" close={()=>setQu(false)}/>}</div>;

function Teachers({d,inst,reload}){

  const add=async()=>{
    const email=f.email.trim().toLowerCase();
    if(!f.name.trim()||!email.includes('@'))return setErr('Please enter the teacher name and a valid email.');
    if(d.teachers.some(t=>t.email.toLowerCase()===email))return setErr('A teacher with this email already exists.');

  };
  const lock=async t=>{const r=await sb.from('teachers').update({locked:!t.locked}).eq('id',t.id);if(r.error)alert(r.error.message);reload()};
  const del=async t=>{if(!confirm(`Are you sure you want to remove ${t.name}? The teacher will lose access permanently.`))return;const r=await sb.from('teachers').delete().eq('id',t.id);if(r.error)alert(r.error.message);reload()};

    <p className="text-xs text-slate-500 mt-3 bg-amber-50 rounded-lg p-2">Note: The teacher just needs to open this same link and Sign Up using this exact email. After login they will see only their assigned class.</p></div>
    <div className="space-y-2">{d.teachers.map(t=><div key={t.id} className="bg-white rounded-xl p-3 shadow-sm flex justify-between items-center gap-2">
      <div><div className="font-semibold">{t.name}</div><div className="text-xs text-slate-500">{t.email} · Class: {t.assigned_class}{t.locked&&<b className="text-red-600"> · LOCKED</b>}</div></div>
      <div className="flex gap-1"><button onClick={()=>lock(t)} className={`px-2.5 py-1.5 rounded-lg text-xs font-medium ${t.locked?'bg-green-600 text-white':'bg-amber-100 text-amber-800'}`}>{t.locked?'Unlock Teacher':'Lock Teacher'}</button><button onClick={()=>del(t)} className="px-2.5 py-1.5 rounded-lg bg-red-600 text-white text-xs">🗑 Remove Teacher</button></div></div>)}

function GateAdmin({d,inst}){
  const ref=React.useRef(null),sec=inst.gate_qr_secret;
  const [rows,setRows]=useState([]),[err,setErr]=useState(''),[ld,setLd]=useState(true);
  useEffect(()=>{if(ref.current&&sec){ref.current.innerHTML='';new QRCode(ref.current,{text:sec,width:220,height:220})}},[sec]);
  const fetchRows=async()=>{
    setLd(true);
    const base=()=>sb.from('teacher_attendance').select('*').eq('institute_id',inst.id).order('punch_date',{ascending:false});
    let r=await base().order('punch_time',{ascending:false}).limit(5000);
    if(r.error)r=await base().order('punch_at',{ascending:false}).limit(5000);
    setLd(false);
    if(r.error){setErr(r.error.message);setRows([]);return}
    setErr('');setRows(r.data||[]);
  };
  useEffect(()=>{if(inst.id)fetchRows()},[inst.id]);
  const tm=x=>{
    if(x.punch_time){const m=String(x.punch_time).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);

function GateScan({close}){
  const [res,setRes]=useState(null),[err,setErr]=useState('');
  useEffect(()=>{
    const sc=new Html5Qrcode('gate-reader');let done=false;
    sc.start({facingMode:'environment'},{fps:10,qrbox:240},async txt=>{
      if(done)return;done=true;
      try{await sc.stop()}catch(e){}
      let out;
      try{const r=await sb.rpc('teacher_qr_punch',{scanned_secret:txt.trim()});out=r.error?{ok:false,message:r.error.message}:(r.data||{ok:false,message:'No response from server. Please scan again.'})}
      catch(x){out={ok:false,message:'Network problem. Please check your internet and scan again.'}}
      const fmt=t=>t.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
      const tm=out.time||(out.punched_at?fmt(new Date(out.punched_at)):fmt(new Date()));
      out.time=tm;
      out.msg=out.ok?(out.msg||(out.already?'Punch-In already recorded today at '+tm:'Punch-In Recorded at '+tm)):(out.msg||out.message||'Attendance could not be marked.');
      setRes(out);setTimeout(()=>alert(out.msg),150);
      
    },()=>{}).catch(()=>setErr('Camera could not start. Please allow camera permission (the page must be opened over HTTPS).'));
    return()=>{if(!done){try{sc.stop().catch(()=>{})}catch(e){}}};
  },[]);
  const when=res&&res.punched_at?new Date(res.punched_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})+' IST':'';
  return <Modal title="Scan School Gate QR" close={close}>
    {!res&&<div><div id="gate-reader" style={{width:'100%'}}></div>{err?<p className="text-sm text-red-600 mt-2">{err}</p>:<p className="text-sm text-slate-500 text-center mt-2">Point your camera at the school gate QR code.</p>}</div>}
    {res&&<div className={`rounded-xl p-5 text-center ${res.ok?'bg-green-50':'bg-red-50'}`}>

      <p className={`font-bold text-xl mt-2 ${res.ok?'text-green-700':'text-red-700'}`}>{res.msg}</p>
      {res.ok&&<p className="text-sm mt-1">Recorded at: <b>{res.time}</b></p>}
      
      <button onClick={close} className={btn(res.ok?'green':'red')+' mt-4'}>Close</button></div>}
  </Modal>;
}

// Flexible class matching: "Class 10", "class 10 ", "10", "10th" all match; text-only classes (e.g. JEE/NEET) match case-insensitively
const classKey=v=>{const t=String(v==null?'':v).trim().toLowerCase(),m=t.match(/\d+/);return m?m[0]:t.replace(/\s+/g,' ')};
const classMatch=(assigned,course)=>{const a=String(assigned==null?'':assigned).trim().toLowerCase();return !a||a==='all'||classKey(a)===classKey(course)};
// Accepts nested ({institute:{...}}) or flat ({institute_id, inst_name, ...}) role data; never returns null fields that crash the UI
const normCtx=c=>{
  if(Array.isArray(c))c=c[0];
  if(!c||typeof c!=='object')return {role:'none'};
  const i=(c.institute&&typeof c.institute==='object')?c.institute:{};
  let role=String(c.role||'none').toLowerCase();if(role==='owner')role='principal';
  const far=new Date(Date.now()+365*864e5).toISOString();
  return {...c,role,
    institute:{...i,id:i.id||c.institute_id||c.iid||null,name:i.name||c.inst_name||c.institute_name||c.school_name||'Your School',email:i.email||c.email||'',
      trial_ends:i.trial_ends||c.trial_ends||far,paid_until:i.paid_until||c.paid_until||null,locked:!!(i.locked!=null?i.locked:c.locked),plan:i.plan||c.plan||999},
    assigned_class:c.assigned_class||'All',teacher_name:c.teacher_name||'Teacher',teacher_locked:!!c.teacher_locked};
};

function App(){
  const [s,setS]=useState(undefined),[ctx,setCtx]=useState(undefined);

  useEffect(()=>{sb.auth.getSession().then(({data})=>setS(data.session));const {data}=sb.auth.onAuthStateChange((_,x)=>setS(x));return()=>data.subscription.unsubscribe()},[]);
  const load=async()=>{
    setCtx(undefined);let last={message:'No response from server'};
    for(let k=0;k<2;k++){
      try{const r=await sb.rpc('get_my_school_role');if(!r.error&&r.data){setCtx(normCtx(r.data));return}last=r.error||last}catch(x){last=x}
      await new Promise(z=>setTimeout(z,700));

  };
  useEffect(()=>{if(s&&s.user.email!==ADMIN_EMAIL)load()},[s&&s.user.id]);
  const intent=getIntent();
  if(s===undefined)return <div className="p-10 text-center text-slate-500">Loading…</div>;
  if(!s)return <Auth/>;
  if(s.user.email===ADMIN_EMAIL)return <SuperAdmin/>;
  if(ctx===undefined)return <div className="p-10 text-center text-slate-500">Loading…</div>;
  if(ctx.role==='error'){
    const missing=/get_my_school_role|schema cache|does not exist|column/i.test(ctx.msg||'');
    return <Notice icon="🔄" title="We could not load your account" text={intent==='teacher'?'Please try again in a moment. If this keeps happening, tell your Principal.':'Please check your internet connection and try again.'}>
      <button onClick={load} className={btn()}>Try Again</button>
      {missing&&<p className="text-xs text-amber-700 bg-amber-50 rounded-lg p-2">Setup note for the software owner: run coachpro_fix_roles.sql once in the Supabase SQL Editor.</p>}
      <p className="text-[11px] text-slate-400 break-words">Details: {ctx.msg}</p></Notice>;
  }
  if(ctx.role==='none'){
    if(intent==='teacher')return <Notice icon="📧" title="Teacher account not found" text="Your email is not added by any School Principal yet. Ask your Principal to add your email in Manage Teachers first."><button onClick={load} className={btn()}>Check Again</button></Notice>;
    return <div><Setup reload={load}/><div className="text-center pb-6 text-xs text-slate-500">Are you a teacher? Log out and use the Teacher tab on the login screen.<br/><button onClick={logout} className="mt-2 underline">Log out</button></div></div>;
  }
  if(ctx.role==='principal'&&intent==='teacher')return <Notice icon="🏫" title="This is a Principal account" text="This email belongs to a School Principal. Please log out and use the School / Principal tab."/>;
  const inst=ctx.institute,exp=new Date(Math.max(new Date(inst.trial_ends),inst.paid_until?new Date(inst.paid_until):0));
  if(inst.locked||exp<new Date())return <Locked inst={inst} teacher={ctx.role==='teacher'}/>;
  if(ctx.role==='teacher'&&ctx.teacher_locked)return <Notice icon="🔒" title="Access Locked by Principal" text="Please contact your Principal to unlock your account."/>;
  if(ctx.role==='teacher')return <Boundary><TeacherDashboard ctx={ctx}/></Boundary>;
  return <Dashboard inst={inst} role={ctx.role} assigned={ctx.assigned_class} tname={ctx.teacher_name}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
