<script type="text/babel">
const SUPA_URL="https://xfnxwciskkvpnwgsswic.supabase.co";
const SUPA_KEY="sb_publishable_pG5uFOUCgzCo174V7HFW1w_LoYH5JV2";
const ADMIN_EMAIL="vaibhavpandey00741@gmail.com";
const MY_UPI_ID="future.leiutinent@okicici";
const ADMIN_WA=""; // optional: your WhatsApp number with country code, e.g. 919876543210
const {useState,useEffect}=React;
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const ph=p=>{p=(p||'').replace(/\D/g,'');return p.length===10?'91'+p:p};

const WAB=({href,children})=><a href={href} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-green-600 hover:bg-green-700 whitespace-nowrap">{children||'WhatsApp'}</a>;
const F=({l,children})=><label className="block text-xs font-medium text-slate-600 mb-3">{l}{children}</label>;
const Modal=({title,close,children})=><div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2"><div className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-auto p-5"><div className="flex justify-between mb-3"><h3 className="font-bold text-lg">{title}</h3><button onClick={close} className="text-slate-400 text-xl">✕</button></div>{children}</div></div>;

function Setup({reload}){
  const [n,setN]=useState('');
  const go=async()=>{if(!n.trim())return;const r=await sb.rpc('create_institute',{p_name:n.trim()});if(r.error)alert(r.error.message);else reload();};
  return <div className="min-h-screen flex items-center justify-center p-4"><div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow">
    <h2 className="font-bold text-lg mb-3">Set up your institute</h2>
    <F l="Institute Name"><input className={inp} value={n} onChange={e=>setN(e.target.value)} placeholder="e.g. Sunrise Coaching Classes"/></F>
    <button onClick={go} className={btn()+' w-full'}>Start 7-Day Free Trial</button></div></div>;
}

const GENDERS=['Male','Female','Other'],CATEGORIES=['General','OBC','SC','ST','Other'];
const fmtAadhaar=v=>String(v||'').replace(/\D/g,'').slice(0,12).replace(/(\d{4})(?=\d)/g,'$1 ');
const maskAadhaar=v=>{const x=String(v||'').replace(/\D/g,'');return x.length===12?'XXXX XXXX '+x.slice(8):''};
const fmtDob=v=>v?String(v).split('-').reverse().join('/'):'-';
const gx=v=>{const t=String(v||'').trim().toLowerCase();return !t?null:(t==='male'||t==='m')?'Male':(t==='female'||t==='f')?'Female':'Other'};
const cx=v=>{const t=String(v||'').trim().toUpperCase();return !t?null:['OBC','SC','ST'].includes(t)?t:(t==='GENERAL'||t==='GEN')?'General':'Other'};
const dbHint=m=>/roll_no|mother_name|aadhar_no|dob|gender|category|address|teacher_update_student/i.test(m||'')?m+' — Ask the software owner to run coachpro_student_details.sql in Supabase.':m;

function ExtraInfo({s}){
  const a=[['Roll No.',s.roll_no],['Mother',s.mother_name],['DOB',s.dob?fmtDob(s.dob):''],['Gender',s.gender],['Category',s.category]].filter(x=>x[1]);
  const m=maskAadhaar(s.aadhar_no),b=[m&&'Aadhaar '+m,s.address&&'Address: '+s.address].filter(Boolean);
  if(!a.length&&!b.length)return null;
  return <div className="text-xs text-slate-500 mt-0.5">{a.map(x=>x[0]+': '+x[1]).join(' · ')}{b.length>0&&<div>{b.join(' · ')}</div>}</div>;
}

function StudentModal({st,inst,done,close,teacher}){
  const blank={name:'',course:'Class 10',batch:'',parent_name:'',parent_phone:'',fee:'',paid:0,due_date:'',roll_no:'',mother_name:'',aadhar_no:'',dob:'',gender:'',category:'',address:''};
  const [f,setF]=useState({...blank,...Object.fromEntries(Object.entries(st||{}).map(([k,v])=>[k,v==null?'':v]))});
  const [err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const due=Math.max(0,(+f.fee||0)-(+f.paid||0));
  const save=async()=>{
    if(!String(f.name).trim()||!String(f.parent_phone).trim())return setErr('Student name and parent phone are required.');
    const aad=String(f.aadhar_no||'').replace(/\D/g,'');
    if(aad&&aad.length!==12)return setErr('Aadhaar number must be exactly 12 digits.');
    const extra={roll_no:String(f.roll_no||'').trim()||null,mother_name:String(f.mother_name||'').trim()||null,aadhar_no:aad||null,dob:f.dob||null,gender:f.gender||null,category:f.category||null,address:String(f.address||'').trim()||null};
    setBusy(true);setErr('');
    if(teacher){
      const r=await sb.rpc('teacher_update_student',{p_id:st.id,p_data:{name:String(f.name).trim(),parent_name:String(f.parent_name||'').trim(),parent_phone:String(f.parent_phone).trim(),...extra}});
      setBusy(false);if(r.error)return setErr(dbHint(r.error.message));
      return done();
    }
    const keys=await existingKeys(inst,st&&st.id);
    if(keys.has(dkey(f.name,f.parent_phone))){setBusy(false);return setErr('Duplicate entry blocked: a student named "'+String(f.name).trim()+'" with this parent phone already exists.')}
    const row={name:String(f.name).trim(),course:f.course,batch:f.batch,parent_name:f.parent_name,parent_phone:String(f.parent_phone).trim(),fee:+f.fee||0,paid:+f.paid||0,due_date:f.due_date||null,...extra};
    let sid=st&&st.id,delta=row.paid-(st?(+st.paid||0):0),r;
    if(st)r=await sb.from('students').update(row).eq('id',sid);
    else{r=await sb.from('students').insert({...row,institute_id:inst.id}).select().single();sid=r.data&&r.data.id}
    if(r.error){setBusy(false);return setErr(dbHint(r.error.message))}
    if(delta>0)await sb.from('payments').insert({institute_id:inst.id,student_id:sid,amount:delta});
    setBusy(false);done();
  };
  return <Modal title={teacher?'Edit Student Details':(st?'Edit Student':'Add Student')} close={close}>
    <F l="Student Name"><input className={inp} value={f.name} onChange={set('name')}/></F>
    {!teacher&&<div className="grid grid-cols-2 gap-3">
      <F l="Class / Course"><input list="cl" className={inp} value={f.course} onChange={set('course')}/></F>
      <F l="Batch Timing (optional)"><input list="bl" className={inp} value={f.batch} onChange={set('batch')}/></F></div>}
    {!teacher&&<div><datalist id="cl">{COURSES.map(c=><option key={c}>{c}</option>)}</datalist><datalist id="bl">{BATCHES.map(c=><option key={c}>{c}</option>)}</datalist></div>}
    {teacher&&<div className="text-xs bg-slate-50 rounded-lg px-3 py-2 mb-3 text-slate-600">Class: <b>{f.course}</b> · Batch: <b>{f.batch}</b> · Fees can only be edited by the Principal.</div>}
    <div className="grid grid-cols-2 gap-3">
      <F l="Roll Number"><input className={inp} value={f.roll_no} onChange={set('roll_no')}/></F>
      <F l="Date of Birth"><input className={inp} type="date" value={f.dob} onChange={set('dob')}/></F>
      <F l="Father / Parent Name"><input className={inp} value={f.parent_name} onChange={set('parent_name')}/></F>
      <F l="Mother's Name"><input className={inp} value={f.mother_name} onChange={set('mother_name')}/></F>
      <F l="Parent Phone"><input className={inp} inputMode="tel" value={f.parent_phone} onChange={set('parent_phone')}/></F>
      <F l="Aadhaar Number"><input className={inp} inputMode="numeric" placeholder="0000 0000 0000" value={fmtAadhaar(f.aadhar_no)} onChange={e=>setF({...f,aadhar_no:e.target.value.replace(/\D/g,'').slice(0,12)})}/></F>
      <F l="Gender"><select className={inp} value={f.gender} onChange={set('gender')}><option value="">Select</option>{GENDERS.map(g=><option key={g}>{g}</option>)}</select></F>
      <F l="Category"><select className={inp} value={f.category} onChange={set('category')}><option value="">Select</option>{CATEGORIES.map(g=><option key={g}>{g}</option>)}</select></F></div>
    <F l="Full Address"><input className={inp} value={f.address} onChange={set('address')}/></F>
    {!teacher&&<div><div className="grid grid-cols-2 gap-3">
      <F l="Monthly / Course Fee (₹)"><input className={inp} type="number" value={f.fee} onChange={set('fee')}/></F>
      <F l="Paid Amount (₹)"><input className={inp} type="number" value={f.paid} onChange={set('paid')}/></F></div>
      <div className="flex justify-between items-center bg-amber-50 rounded-lg px-3 py-2 mb-3 text-sm"><span>Pending Due</span><b className="text-amber-700">{inr(due)}</b></div>
      <F l="Next Fee Due Date"><input className={inp} type="date" value={f.due_date||''} onChange={set('due_date')}/></F></div>}
    {err&&<div className="bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2 text-sm mb-3">⚠ {err}</div>}
    <button onClick={save} disabled={busy} className={btn()+' w-full'}>{busy?'Saving…':(teacher?'Save Changes':'Save Student')}</button></Modal>;
}

function Receipt({st,inst,close}){
  const due=Math.max(0,st.fee-st.paid);
  const msg=`Fee Receipt - ${inst.name}\nStudent: ${st.name} (${st.course})\nPaid: Rs.${st.paid}\nBalance Due: Rs.${due}\nDate: ${new Date().toLocaleDateString('en-IN')}`;
  return <Modal title="Fee Receipt" close={close}>
    <div id="receipt" className="border-2 border-dashed rounded-xl p-4 text-sm">
      <div className="text-center font-bold text-lg">{inst.name}</div><div className="text-center text-xs text-slate-500 mb-3">Fee Receipt</div>
      {[['Student',st.name],['Class',st.course],['Paid Amount',inr(st.paid)],['Balance Due',inr(due)],['Date',new Date().toLocaleDateString('en-IN')]].map(([a,b])=><div key={a} className="flex justify-between py-1 border-b"><span className="text-slate-500">{a}</span><b>{b}</b></div>)}</div>
    <div className="flex gap-2 mt-3"><button onClick={()=>window.print()} className={btn()+' flex-1'}>Print</button><a href={wa(st.parent_phone,msg)} target="_blank" rel="noreferrer" className={btn('green')+' flex-1 text-center'}>Share on WhatsApp</a></div></Modal>;
}

const dkey=(n,p)=>(n||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+(p||'').replace(/\D/g,'').slice(-10);
const existingKeys=async(inst,exceptId)=>{const {data}=await sb.from('students').select('id,name,parent_phone').eq('institute_id',inst.id);return new Set((data||[]).filter(x=>x.id!==exceptId).map(x=>dkey(x.name,x.parent_phone)))};
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()};
const isoDate=s=>{const m=(s||'').match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:(s||null)};
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}

function Queue({items,label,close}){
  const bulkQueue=items||[],[currentIndex,setCurrentIndex]=useState(0),[blocked,setBlocked]=useState(''),lock=React.useRef(false);
  const n=bulkQueue.length,cur=bulkQueue[currentIndex];
  const url=cur?wa(cur.phone,cur.text):'';
  const send=()=>{
    if(!cur||lock.current)return;
    lock.current=true;setTimeout(()=>{lock.current=false},600);
    const w=window.open(url,'_blank');
    if(!w){setBlocked(url);return}
    setBlocked('');setCurrentIndex(prev=>prev+1);
  };
  const skip=()=>{setBlocked('');setCurrentIndex(prev=>prev+1)};
  return <Modal title="Bulk WhatsApp Queue" close={close}>
    {cur?<div className="text-center">
      <div className="text-sm font-semibold text-slate-600 mb-1">Sending {currentIndex+1} of {n}</div>
      <div className="h-2 bg-slate-100 rounded mb-3"><div className="h-2 bg-green-600 rounded" style={{width:(currentIndex/n*100)+'%'}}></div></div>
      <div className="text-lg font-bold">{cur.name}</div>
      <div className="text-sm text-slate-600 mb-2">Parent Phone: <b>{cur.phone}</b></div>
      <div className="text-xs bg-slate-50 rounded-lg p-2 mb-4 text-left whitespace-pre-line">{cur.text}</div>
      <button onClick={send} className="w-full py-4 rounded-xl text-white text-lg font-bold bg-green-600 hover:bg-green-700">Send on WhatsApp & Next →</button>
      {blocked&&<div className="mt-3 bg-amber-50 rounded-lg p-3 text-sm"><p className="mb-2">Your browser blocked the pop-up. Tap the link below to open WhatsApp for {cur.name}.</p><a href={blocked} target="_blank" rel="noreferrer" onClick={()=>{setBlocked('');setTimeout(()=>setCurrentIndex(prev=>prev+1),200)}} className="inline-block px-4 py-2 rounded-lg bg-green-600 text-white font-semibold">Open WhatsApp & Next →</a></div>}
      <button onClick={skip} className="mt-3 text-sm text-slate-500 px-4 py-2">Skip this one</button>
    </div>:<div className="text-center py-6"><div className="text-4xl">✅</div><p className="font-semibold mt-2">All {n} messages are done</p><button onClick={close} className={btn()+' mt-3'}>Close</button></div>}
  </Modal>;
}

function Students({d,inst,reload,openAdd,ro}){
  const [q,setQ]=useState(''),[ed,setEd]=useState(null),[rc,setRc]=useState(null),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false),[view,setView]=useState('cols'),[promo,setPromo]=useState(false);
  const list=d.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
  const del=async s=>{if(!confirm(`Are you sure you want to delete ${s.name}? All records will be permanently removed.`))return;const r=await sb.from('students').delete().eq('id',s.id);if(r.error)alert(r.error.message);reload()};
  const sample=()=>dl('coachpro_students_sample.csv','Student Name,Class,Batch,Parent Name,Parent Phone,Total Fee,Paid,Due Date,roll_no,mother_name,aadhar_no,dob,gender,category,address\nRahul Sharma,Class 10,,Suresh Sharma,9876543210,1500,500,2026-12-05,12,Sunita Sharma,123412341234,2010-05-14,Male,General,"12 Gandhi Nagar, Lucknow"\nPriya Verma,Class 12,,Anil Verma,9123456780,2000,2000,2026-12-10,7,Rekha Verma,,2008-11-02,Female,OBC,"45 Station Road, Lucknow"\n');
  const dueOf=x=>Math.max(0,(+x.fee||0)-(+x.paid||0));
  const remind=x=>wa(x.parent_phone,`Dear Parent, fee of Rs.${dueOf(x)} for ${x.name} is due at ${inst.name}. Please pay at your earliest convenience.`);
  const groups=(()=>{const m={};list.forEach(x=>{const k=classKey(x.course)||'—';(m[k]=m[k]||{k,name:/^\d+$/.test(k)?'Class '+k:(String(x.course||'').trim()||'No Class'),items:[]}).items.push(x)});return Object.values(m).sort((a,b)=>{const na=/^\d+$/.test(a.k),nb=/^\d+$/.test(b.k);return na&&nb?a.k-b.k:na?-1:nb?1:a.name.localeCompare(b.name)})})();
  const imp=async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;setBusy(true);setMsg('');
    try{
      const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));
      const norm=x=>String(x).trim().toLowerCase().replace(/[\s_]+/g,' '),h=(rows.shift()||[]).map(norm),ix=n=>h.indexOf(norm(n));
      if(ix('student name')<0||ix('parent phone')<0){setMsg('error:The file must have "Student Name" and "Parent Phone" columns. Download the sample CSV to see the format.');setBusy(false);return}
      const g=(r,n)=>ix(n)<0?'':(r[ix(n)]||'').trim();
      const keys=await existingKeys(inst),add=[];let dup=0,bad=0;
      rows.forEach(r=>{const name=g(r,'student name'),pp=g(r,'parent phone');if(!name||!pp){bad++;return}const k=dkey(name,pp);if(keys.has(k)){dup++;return}keys.add(k);add.push({institute_id:inst.id,name,course:g(r,'class')||null,batch:g(r,'batch')||null,parent_name:g(r,'parent name')||null,parent_phone:pp,fee:+g(r,'total fee')||0,paid:+g(r,'paid')||0,due_date:isoDate(g(r,'due date')),roll_no:g(r,'roll_no')||null,mother_name:g(r,'mother_name')||null,aadhar_no:(g(r,'aadhar_no').replace(/\D/g,'').length===12?g(r,'aadhar_no').replace(/\D/g,''):null),dob:isoDate(g(r,'dob')),gender:gx(g(r,'gender')),category:cx(g(r,'category')),address:g(r,'address')||null})});
      let ok=0;
      for(let i=0;i<add.length;i+=500){
        const r=await sb.from('students').insert(add.slice(i,i+500)).select('id,paid');
        if(r.error){setMsg('error:'+r.error.message);setBusy(false);reload();return}
        ok+=r.data.length;
        const pay=r.data.filter(x=>x.paid>0).map(x=>({institute_id:inst.id,student_id:x.id,amount:x.paid}));
        if(pay.length)await sb.from('payments').insert(pay);
      }
      setMsg(`ok:Imported ${ok} students, skipped ${dup} duplicates`+(bad?` (${bad} rows ignored: missing name or phone)`:'')+'.');
    }catch(x){setMsg('error:'+x.message)}
    setBusy(false);reload();
  };
  return <div>
    <div className="flex flex-wrap gap-2 mb-3"><input className={inp+' !mt-0 flex-1 min-w-[140px]'} placeholder="Search students" value={q} onChange={e=>setQ(e.target.value)}/>
      {!ro&&<button onClick={openAdd} className={btn()+' whitespace-nowrap'}>+ Add Student</button>}
      {!ro&&<button onClick={()=>setPromo(true)} className={btn('amber')+' whitespace-nowrap'}>Promote Class</button>}
      {!ro&&<label className={btn('violet')+' whitespace-nowrap cursor-pointer'}>{busy?'Importing…':'Import CSV'}<input type="file" accept=".csv,text/csv" className="hidden" onChange={imp} disabled={busy}/></label>}
      {!ro&&<button onClick={sample} className="px-3 py-2 rounded-lg text-sm bg-white border">Download Sample CSV</button>}</div>
    {msg&&<div className={`rounded-lg px-3 py-2 text-sm mb-3 ${msg.startsWith('ok:')?'bg-green-50 text-green-700':'bg-red-50 text-red-700'}`}>{msg.replace(/^(ok|error):/,'')}</div>}
    {!ro&&<div className="flex gap-2 mb-3"><button onClick={()=>setView('cols')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${view==='cols'?'bg-indigo-600 text-white':'bg-white border'}`}>Class Columns View</button><button onClick={()=>setView('list')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${view==='list'?'bg-indigo-600 text-white':'bg-white border'}`}>Table List View</button></div>}
    {(!ro&&view==='cols')?(
    <div className="flex gap-3 overflow-x-auto pb-3 items-start">{groups.map(g=>{const pend=g.items.reduce((a,x)=>a+dueOf(x),0);return <div key={g.k} className="w-[290px] min-w-[290px] shrink-0 bg-slate-50 rounded-xl p-2 border border-slate-200">
      <div className="bg-indigo-600 text-white rounded-lg px-3 py-2 mb-2"><div className="flex justify-between items-center gap-2"><b>{g.name}</b><span className="bg-white text-indigo-700 text-xs font-bold rounded-full px-2 py-0.5">{g.items.length} students</span></div><div className="text-xs mt-1 text-indigo-100">Pending fees: <b className="text-white">{inr(pend)}</b></div></div>
      <div className="space-y-2">{g.items.map(x=><div key={x.id} className="bg-white rounded-lg p-2 shadow-sm">
        <div className="font-semibold text-sm">{x.name}</div><div className="text-xs text-slate-500">{x.batch} · {x.parent_name} {x.parent_phone}</div><ExtraInfo s={x}/>
        <div className="text-xs mt-1">Fee {inr(x.fee)} · Paid {inr(x.paid)} · Due <b className="text-amber-700">{inr(dueOf(x))}</b></div>
        <div className="flex flex-wrap gap-1 mt-2 items-center text-xs"><button onClick={()=>setEd(x)} className="px-2 py-1.5 rounded-lg bg-slate-100">Edit</button>

const byRoll=(a,b)=>{const x=parseInt(a.roll_no,10),y=parseInt(b.roll_no,10);if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;if(!isNaN(x)&&isNaN(y))return -1;if(isNaN(x)&&!isNaN(y))return 1;return String(a.name).localeCompare(String(b.name))};
const monthLabel=ym=>{const [y,m]=String(ym||'').split('-');return y&&m?new Date(+y,+m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'}):''};
const groupByClass=list=>{const m={};list.forEach(x=>{const k=classKey(x.course)||'—';(m[k]=m[k]||{k,name:/^\d+$/.test(k)?'Class '+k:(String(x.course||'').trim()||'No Class'),items:[]}).items.push(x)});return Object.values(m).sort((a,b)=>{const na=/^\d+$/.test(a.k),nb=/^\d+$/.test(b.k);return na&&nb?a.k-b.k:na?-1:nb?1:a.name.localeCompare(b.name)})};
const punchTime=x=>{
  if(x.punch_time){const m=String(x.punch_time).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m){let h=+m[1];const ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+m[2]+(m[3]?':'+m[3]:'')+' '+ap}return String(x.punch_time)}
  return x.punch_at?new Date(x.punch_at).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).toUpperCase():'—';
};
async function fetchMonthAtt(ym){
  const [y,m]=ym.split('-').map(Number),last=new Date(y,m,0).getDate(),start=ym+'-01',end=ym+'-'+String(last).padStart(2,'0');
  let all=[],from=0;
  for(;;){
    const r=await sb.from('attendance').select('student_id,att_date,status').gte('att_date',start).lte('att_date',end).order('att_date').order('student_id').range(from,from+999);
    if(r.error)throw r.error;
    all=all.concat(r.data||[]);
    if(!r.data||r.data.length<1000)break;
    from+=1000;
  }
  return all;
}
function monthlyRows(students,att,withClass){
  const by={};att.forEach(a=>{(by[a.student_id]=by[a.student_id]||{})[+String(a.att_date).slice(8,10)]=a.status});
  const days=Array.from({length:31},(_,i)=>i+1);
  const head=[...(withClass?['Class']:[]),'Roll No','Student Name','Father Name','Total Present Days','Total Absent Days','Attendance %',...days];
  return [head,...students.map(s=>{const m=by[s.id]||{};let p=0,a=0;Object.values(m).forEach(v=>v==='present'?p++:a++);const t=p+a;
    return [...(withClass?[s.course||'']:[]),s.roll_no||'',s.name,s.parent_name||'',p,a,t?(p*100/t).toFixed(1)+'%':'-',...days.map(dd=>m[dd]?(m[dd]==='present'?'P':'A'):'')]})];
}
const toCSV=rows=>'\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
async function exportMonthly(students,ym,withClass,fname){
  if(!ym)return alert('Please select a month and year first.');
  try{const att=await fetchMonthAtt(ym);dl(fname.replace(/[^\w-]+/g,'_')+'_'+ym+'.csv',toCSV(monthlyRows(students,att,withClass)))}
  catch(e){alert('Could not download the register: '+((e&&e.message)||e))}
}

}

function PromoteModal({d,close,done}){
  const next=g=>/^\d+$/.test(g.k)?(+g.k>=12?'Passed Out':'Class '+(+g.k+1)):g.name;
  const [rows,setRows]=useState(groupByClass(d.students).map(g=>({k:g.k,name:g.name,ids:g.items.map(x=>x.id),to:next(g),on:/^\d+$/.test(g.k)&&+g.k<12}))),[busy,setBusy]=useState(false);
  const upd=(k,p)=>setRows(rows.map(r=>r.k===k?{...r,...p}:r));
  const run=async()=>{
    const sel=rows.filter(r=>r.on&&r.to.trim()&&r.to.trim()!==r.name),total=sel.reduce((a,r)=>a+r.ids.length,0);
    if(!sel.length)return alert('Select at least one class and enter the new class name.');
    if(!confirm(`Move ${total} students to their next class?\n\n${sel.map(r=>r.name+' → '+r.to.trim()).join('\n')}\n\nThis changes every selected student's class. Export your records first if needed.`))return;
    setBusy(true);
    for(const r of sel)for(let i=0;i<r.ids.length;i+=100){
      const x=await sb.from('students').update({course:r.to.trim()}).in('id',r.ids.slice(i,i+100));
      if(x.error){setBusy(false);alert('Stopped while moving '+r.name+': '+x.error.message+'\nClasses before this one were already moved.');return}
    }
    setBusy(false);alert('Done. '+total+' students were promoted.');done();
  };
  return <Modal title="Promote Class (End of Session)" close={close}>
    <p className="text-xs text-slate-600 mb-3">Tick the classes to move and check the new class name. All students of a ticked class move together. Class 12 is not ticked by default (type a name like "Passed Out" and tick it to move them).</p>

      <input className="flex-1 min-w-0 border border-slate-300 rounded-lg px-2 py-1.5 text-sm" value={r.to} onChange={e=>upd(r.k,{to:e.target.value})}/></div>)}
      {!rows.length&&<p className="text-sm text-slate-500">No students to promote.</p>}</div>
    <button onClick={run} disabled={busy} className={btn()+' w-full'}>{busy?'Promoting…':'Promote Selected Classes'}</button></Modal>;
}

const ALL_CLASSES=Array.from({length:12},(_,i)=>'Class '+(i+1));
const isAllVal=v=>String(v||'').split(',').some(x=>/^\s*all( classes)?\s*$/i.test(x));
const splitClasses=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);

function ClassPills({value,onChange,extra}){
  const sel=splitClasses(value),all=isAllVal(value),opts=[];
  [...ALL_CLASSES,...(extra||[]),...sel.filter(x=>!/^all/i.test(x))].forEach(c=>{if(c&&!opts.some(o=>classKey(o)===classKey(c)))opts.push(c)});
  const on=c=>!all&&sel.some(x=>classKey(x)===classKey(c));
  const toggle=c=>{
    if(c==='All')return onChange(all?'':'All');
    const cur=all?[]:sel,next=on(c)?cur.filter(x=>classKey(x)!==classKey(c)):[...cur,c];
    onChange(opts.filter(o=>next.some(x=>classKey(x)===classKey(o))).join(', '));
  };
  const pill=(label,active,fn)=><button type="button" key={label} onClick={fn} className={`px-3 py-1.5 rounded-full text-sm border ${active?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-700 border-slate-300'}`}>{active?'✓ ':''}{label}</button>;
  return <div className="flex flex-wrap gap-2">{pill('All Classes',all,()=>toggle('All'))}{opts.map(c=>pill(c,on(c),()=>toggle(c)))}</div>;
}

function Teachers({d,inst,reload}){
  const [f,setF]=useState({name:'',email:'',assigned_class:''}),[err,setErr]=useState(''),[ed,setEd]=useState(null),[edN,setEdN]=useState(''),[edC,setEdC]=useState('');

function GateScan({close}){
  const [res,setRes]=useState(null),[err,setErr]=useState('');
  useEffect(()=>{
    const sc=new Html5Qrcode('gate-reader');let done=false;
    sc.start({facingMode:'environment'},{fps:10,qrbox:240},async txt=>{
      if(done)return;done=true;
      try{await sc.stop()}catch(e){}
      let out;
      try{const r=await sb.rpc('teacher_qr_punch',{scanned_secret:txt.trim()});out=r.error?{ok:false,message:r.error.message}:(r.data||{ok:false,message:'No response from server. Please scan again.'})}
      catch(x){out={ok:false,message:'Network problem. Please check your internet and scan again.'}}
      const fmt=t=>t.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
      const tm=out.time||(out.punched_at?fmt(new Date(out.punched_at)):fmt(new Date()));
      out.time=tm;
      out.msg=out.ok?(out.msg||(out.already?'Punch-In already recorded today at '+tm:'Punch-In Recorded at '+tm)):(out.msg||out.message||'Attendance could not be marked.');
      setRes(out);setTimeout(()=>alert(out.msg),150);
      
    },()=>{}).catch(()=>setErr('Camera could not start. Please allow camera permission (the page must be opened over HTTPS).'));
    return()=>{if(!done){try{sc.stop().catch(()=>{})}catch(e){}}};
  },[]);
  const when=res&&res.punched_at?new Date(res.punched_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})+' IST':'';
  return <Modal title="Scan School Gate QR" close={close}>
    {!res&&<div><div id="gate-reader" style={{width:'100%'}}></div>{err?<p className="text-sm text-red-600 mt-2">{err}</p>:<p className="text-sm text-slate-500 text-center mt-2">Point your camera at the school gate QR code.</p>}</div>}
    {res&&<div className={`rounded-xl p-5 text-center ${res.ok?'bg-green-50':'bg-red-50'}`}>

      {res.ok&&<p className="text-sm mt-1">Recorded at: <b>{res.time}</b></p>}
      
      <button onClick={close} className={btn(res.ok?'green':'red')+' mt-4'}>Close</button></div>}
  </Modal>;
}

// Flexible class matching: "Class 10", "class 10 ", "10", "10th" all match; text-only classes (e.g. JEE/NEET) match case-insensitively
const classKey=v=>{const t=String(v==null?'':v).trim().toLowerCase(),m=t.match(/\d+/);return m?m[0]:t.replace(/\s+/g,' ')};
const classMatch=(assigned,course)=>{const list=String(assigned==null?'':assigned).split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(!list.length)return true;return list.some(a=>a==='all'||a==='all classes'||classKey(a)===classKey(course))};
// Accepts nested ({institute:{...}}) or flat ({institute_id, inst_name, ...}) role data; never returns null fields that crash the UI
const normCtx=c=>{
  if(Array.isArray(c))c=c[0];
  if(!c||typeof c!=='object')return {role:'none'};
  const i=(c.institute&&typeof c.institute==='object')?c.institute:{};
  let role=String(c.role||'none').toLowerCase();if(role==='owner')role='principal';
  const far=new Date(Date.now()+365*864e5).toISOString();
  return {...c,role,
    institute:{...i,id:i.id||c.institute_id||c.iid||null,name:i.name||c.inst_name||c.institute_name||c.school_name||'Your School',email:i.email||c.email||'',
      trial_ends:i.trial_ends||c.trial_ends||far,paid_until:i.paid_until||c.paid_until||null,locked:!!(i.locked!=null?i.locked:c.locked),plan:i.plan||c.plan||999},
    assigned_class:c.assigned_class||'All',teacher_name:c.teacher_name||'Teacher',teacher_locked:!!c.teacher_locked};
};

    if(!em||!p)return setMsg('Please enter your email and password.');
    if(tab==='admin'&&em!==ADMIN_EMAIL)return setMsg('This login is only for the Super Admin.');
    setBusy(true);
    try{localStorage.setItem('cp_intent',tab)}catch(x){}
    const r=m==='in'?await sb.auth.signInWithPassword({email:em,password:p}):await sb.auth.signUp({email:em,password:p});
    setBusy(false);
    if(r.error)return setMsg(r.error.message);
    if(m==='up'&&!r.data.session)setMsg('Account created. Please check your email to confirm it, then log in on this tab.');
  };
  return <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-600 to-violet-700">
    <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h1 className="text-2xl font-bold text-indigo-700">🎓 CoachPro</h1>
      <p className="text-xs text-slate-500 mb-3">School & Coaching Management</p>
      <div className="grid grid-cols-3 gap-1 bg-slate-100 rounded-xl p-1 mb-4">{Object.entries(TABS).map(([k,v])=><button key={k} onClick={()=>{setTab(k);setM('in');setMsg('')}} className={`rounded-lg py-2 text-xs font-semibold leading-tight ${tab===k?'bg-indigo-600 text-white shadow':'text-slate-600'}`}><div className="text-base">{v.icon}</div>{v.label}</button>)}</div>
      <p className="text-sm text-slate-600 mb-3">{t.sub}</p>
      <F l="Email"><input className={inp} type="email" value={e} onChange={x=>setE(x.target.value)}/></F>
      <F l="Password"><input className={inp} type="password" value={p} onChange={x=>setP(x.target.value)}/></F>
      {msg&&<p className="text-sm text-red-600 mb-2">{msg}</p>}
      <button onClick={go} disabled={busy} className={btn()+' w-full'}>{busy?'Please wait…':(m==='in'?t.btnIn:t.btnUp)}</button>
      <button onClick={()=>{setM(m==='in'?'up':'in');setMsg('')}} className="mt-3 text-sm text-indigo-600 w-full">{m==='in'?t.up:t.inn}</button>
    </div></div>;
}

function Notice({icon,title,text,children}){
  return <div className="min-h-screen flex items-center justify-center p-4"><div className="bg-white rounded-2xl p-6 max-w-sm text-center shadow"><div className="text-5xl">{icon}</div><h2 className="font-bold text-lg mt-2">{title}</h2><p className="text-sm text-slate-600 mt-2">{text}</p><div className="mt-4 flex flex-col gap-2">{children}<button onClick={logout} className="text-sm text-slate-500">Log out</button></div></div></div>;
}

function App(){
  const [s,setS]=useState(undefined),[ctx,setCtx]=useState(undefined);
  appReset=()=>{setS(null);setCtx(undefined)};
  useEffect(()=>{sb.auth.getSession().then(({data})=>setS(data.session));const {data}=sb.auth.onAuthStateChange((_,x)=>setS(x));return()=>data.subscription.unsubscribe()},[]);
  const load=async()=>{
    setCtx(undefined);let last={message:'No response from server'};
    for(let k=0;k<2;k++){
      try{const r=await sb.rpc('get_my_school_role');if(!r.error&&r.data){setCtx(normCtx(r.data));return}last=r.error||last}catch(x){last=x}
      await new Promise(z=>setTimeout(z,700));
    }
    setCtx({role:'error',msg:(last&&last.message)||'Unknown error'});
  };
  useEffect(()=>{if(s&&s.user.email!==ADMIN_EMAIL)load()},[s&&s.user.id]);
  useEffect(()=>{
    if(!s||!ctx||ctx.role!=='teacher')return;
    const id=setInterval(async()=>{try{const r=await sb.rpc('get_my_school_role');if(!r.error&&r.data)setCtx(normCtx(r.data))}catch(e){}},60000);
    return()=>clearInterval(id);
  },[s&&s.user.id,ctx&&ctx.role]);
  const intent=getIntent();
  if(s===undefined)return <div className="p-10 text-center text-slate-500">Loading…</div>;
  if(!s)return <Auth/>;
  if(s.user.email===ADMIN_EMAIL)return <SuperAdmin/>;
  if(ctx===undefined)return <div className="p-10 text-center text-slate-500">Loading…</div>;
  if(ctx.role==='error'){
    const missing=/get_my_school_role|schema cache|does not exist|column/i.test(ctx.msg||'');
    return <Notice icon="🔄" title="We could not load your account" text={intent==='teacher'?'Please try again in a moment. If this keeps happening, tell your Principal.':'Please check your internet connection and try again.'}>
      <button onClick={load} className={btn()}>Try Again</button>
      {missing&&<p className="text-xs text-amber-700 bg-amber-50 rounded-lg p-2">Setup note for the software owner: run coachpro_fix_roles.sql once in the Supabase SQL Editor.</p>}
      <p className="text-[11px] text-slate-400 break-words">Details: {ctx.msg}</p></Notice>;
  }
  if(ctx.role==='none'){
    if(intent==='teacher')return <Notice icon="📧" title="Teacher account not found" text="Your email is not added by any School Principal yet. Ask your Principal to add your email in Manage Teachers first."><button onClick={load} className={btn()}>Check Again</button></Notice>;
    return <div><Setup reload={load}/><div className="text-center pb-6 text-xs text-slate-500">Are you a teacher? Log out and use the Teacher tab on the login screen.<br/><button onClick={logout} className="mt-2 underline">Log out</button></div></div>;
  }
  if(ctx.role==='principal'&&intent==='teacher')return <Notice icon="🏫" title="This is a Principal account" text="This email belongs to a School Principal. Please log out and use the School / Principal tab."/>;
  const inst=ctx.institute,exp=new Date(Math.max(new Date(inst.trial_ends),inst.paid_until?new Date(inst.paid_until):0));
  if(ctx.role==='teacher'&&(ctx.teacher_locked||ctx.locked===true||inst.locked))return <div className="min-h-screen flex items-center justify-center p-4 bg-red-600"><div className="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-xl border-4 border-red-700"><div className="text-6xl">⛔</div><h2 className="font-bold text-2xl text-red-700 mt-2">Access Locked</h2><p className="text-sm text-slate-700 mt-2">Please contact your School Principal / Administrator.</p><button type="button" onClick={logout} style={{touchAction:'manipulation'}} className="relative z-50 cursor-pointer w-full mt-5 py-4 rounded-xl bg-red-600 active:bg-red-700 text-white text-lg font-bold">Log out</button></div></div>;
  if(inst.locked||exp<new Date())return <Locked inst={inst} teacher={ctx.role==='teacher'}/>;
  if(ctx.role==='teacher')return <Boundary><TeacherDashboard ctx={ctx}/></Boundary>;
  return <Dashboard inst={inst} role={ctx.role} assigned={ctx.assigned_class} tname={ctx.teacher_name}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
